# Digital Industry Analytics Platform Configuration

project:
  name: "Digital Industry Analytics Platform with AI-assisted Insights"
  version: "1.0.0"
  description: "Enterprise analytical data platform for digital industry decision support, with AI-assisted insights"

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  database: "database/analytics.db"
  reports: "reports"

data:
  primary_file: "digital_industry_indicators.csv"
  years:
    start: 2015
    end: 2024
  industries:
    - Software & IT Services
    - Electronics Manufacturing
    - Telecommunications
    - FinTech
    - E-Commerce
    - Industrial Automation
    - Cloud & Data Centers
    - Digital Media
  regions:
    - North America
    - Europe
    - East Asia
    - Southeast Asia
    - Latin America

indicators:
  composite_weights:
    technology_investment: 0.30
    digital_index: 0.25
    rd_ratio: 0.25
    employment_growth: 0.20
  normalize_method: "minmax"  # minmax | zscore

analytics:
  correlation_method: "pearson"
  regression_target: "revenue_growth"
  regression_features:
    - technology_investment
    - digital_index
    - rd_ratio
    - employment
  significance_level: 0.05

forecasting:
  horizon_years: 5
  methods:
    - linear_trend
    - arima
  arima_order: [1, 1, 1]
  default_metric: "digital_index"

llm:
  model: "gpt-4o-mini"
  temperature: 0.3
  max_tokens: 1500
  base_url: null  # set for OpenAI-compatible endpoints

dashboard:
  page_title: "Digital Industry Analytics Platform"
  layout: "wide"
  theme_primary: "#0B3D5C"
